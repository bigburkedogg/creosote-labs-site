<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creosote Labs · Admin</title>
<style>
  :root { --bg:#faf6ee; --panel:#fffdf8; --fg:#0f1a11; --muted:#5b6862; --line:rgba(15,26,17,.12); --accent:#1f3324; --tan:#c9a87a; --ok:#3a5d44; --warn:#8a3e1d; --tk:#fff1a8; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  .app { display:grid; grid-template-columns: 280px minmax(0,1fr); min-height:100vh; }
  aside { border-right:1px solid var(--line); padding:18px 16px; background:var(--panel); position:sticky; top:0; height:100vh; overflow:auto; }
  aside h1 { font-size:17px; margin:0 0 14px; }
  aside h2 { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:18px 0 6px; }
  aside a.f { display:block; padding:6px 8px; border-radius:4px; color:var(--fg); text-decoration:none; font-size:14px; }
  aside a.f:hover { background:var(--bg); }
  aside a.f.on { background:var(--accent); color:#faf6ee; }
  aside input.filter { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:4px; font:inherit; margin:6px 0; }
  main { padding:22px 32px 80px; max-width:920px; }
  .top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .top h2 { margin:0; font-size:22px; flex:1; }
  button { font:inherit; font-weight:600; padding:9px 14px; border-radius:4px; border:1px solid transparent; cursor:pointer; background:var(--accent); color:#faf6ee; }
  button.quiet { background:transparent; color:var(--accent); border-color:var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .msg { font-size:13px; color:var(--muted); min-height:18px; margin:0 0 12px; white-space:pre-wrap; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--warn); }
  fieldset { border:1px solid var(--line); border-radius:6px; padding:14px 16px 6px; margin:0 0 14px; background:var(--panel); }
  legend { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:0 6px; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  input[type=text], textarea { width:100%; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--fg); }
  textarea { min-height:38px; resize:vertical; line-height:1.45; }
  .empty { background:var(--tk); }
  .item { border-left:2px solid var(--tan); padding:4px 0 4px 12px; margin:8px 0; }
  .row { display:flex; gap:8px; align-items:center; justify-content:flex-end; }
  .row button { padding:4px 9px; font-size:12px; font-weight:500; }
  .hint { font-size:12px; color:var(--muted); margin:2px 0 0; }
  .status { font-size:13px; color:var(--muted); margin-left:auto; }
  .status b { color:var(--fg); font-weight:600; }
  .notes textarea { min-height:120px; }
  .drop { border:1px dashed var(--line); padding:10px; border-radius:4px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Creosote Labs admin</h1>
    <div id="nav"></div>
    <h2>Notes for Claude</h2>
    <div class="notes"><textarea id="notes" placeholder="Anything you want Claude to handle next session: copy to rewrite, a page to add, a change to the layout."></textarea>
    <div class="row" style="justify-content:flex-start;margin-top:6px"><button class="quiet" onclick="saveNotes()">Save notes</button></div></div>
  </aside>
  <main>
    <div class="top">
      <h2 id="title">Site</h2>
      <span class="status" id="status"></span>
      <button class="quiet" onclick="preview()">Preview</button>
      <button class="quiet" onclick="save()">Save</button>
      <button onclick="publish()">Publish</button>
    </div>
    <p class="msg" id="msg">Save rebuilds the preview. Publish pushes the site live; the live site updates in about a minute. Yellow fields are placeholders still to be filled in.</p>
    <form id="form" onsubmit="return false"></form>
  </main>
</div>
<script>
let files = [], basePath = '', current = null, data = null;

const humanize = k => k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
const isLong = (k, v) => v.length > 70 || /text|intro|sub|situation|results|ongoing|summary|answer|^a$|meta_description|quote/.test(k);

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || j.log || 'request failed'); return j;
}
function msg(t, cls) { const m = document.getElementById('msg'); m.textContent = t; m.className = 'msg ' + (cls || ''); }

async function loadTree() {
  const t = await api('GET', '/api/tree'); files = t.files; basePath = t.base_path || '';
  const groups = {}; files.forEach(f => (groups[f.group] = groups[f.group] || []).push(f));
  const order = ['Site', 'Pages', 'Landing taxonomy', 'Landing pages'];
  let h = '';
  for (const g of order) {
    if (!groups[g]) continue;
    h += `<h2>${g}</h2>`;
    if (g === 'Landing pages') h += `<input class="filter" placeholder="Filter ${groups[g].length} pages" oninput="filterNav(this.value)">`;
    h += `<div data-group="${g}">` + groups[g].map(f => `<a class="f" href="#${f.path}" data-path="${f.path}">${f.label}</a>`).join('') + '</div>';
  }
  document.getElementById('nav').innerHTML = h;
  document.querySelectorAll('a.f').forEach(a => a.onclick = e => { e.preventDefault(); open(a.dataset.path); });
  refreshStatus();
}
function filterNav(q) { q = q.toLowerCase(); document.querySelectorAll('[data-group="Landing pages"] a.f').forEach(a => a.style.display = a.textContent.toLowerCase().includes(q) ? '' : 'none'); }

async function open(path) {
  const r = await api('GET', '/api/file?path=' + encodeURIComponent(path));
  current = path; data = r.data;
  document.querySelectorAll('a.f').forEach(a => a.classList.toggle('on', a.dataset.path === path));
  document.getElementById('title').textContent = files.find(f => f.path === path)?.label || path;
  render();
  msg('');
}

function render() {
  const form = document.getElementById('form');
  form.innerHTML = '';
  form.appendChild(fields(data, []));
}
function fields(obj, path) {
  const frag = document.createDocumentFragment();
  for (const [k, v] of Object.entries(obj)) {
    const p = path.concat(k);
    if (Array.isArray(v)) {
      const fs = document.createElement('fieldset'); fs.innerHTML = `<legend>${humanize(k)}</legend>`;
      v.forEach((item, i) => {
        const wrap = document.createElement('div'); wrap.className = 'item';
        if (typeof item === 'object' && item !== null) wrap.appendChild(fields(item, p.concat(i)));
        else wrap.appendChild(control(p.concat(i), '', String(item)));
        const row = document.createElement('div'); row.className = 'row';
        row.innerHTML = `<button type="button" class="quiet" data-op="up">↑</button><button type="button" class="quiet" data-op="down">↓</button><button type="button" class="quiet" data-op="del">Remove</button>`;
        row.querySelectorAll('button').forEach(b => b.onclick = () => listOp(p, i, b.dataset.op));
        wrap.appendChild(row); fs.appendChild(wrap);
      });
      const add = document.createElement('div'); add.className = 'row'; add.style.justifyContent = 'flex-start';
      add.innerHTML = `<button type="button" class="quiet">Add</button>`;
      add.querySelector('button').onclick = () => { const tpl = v.length ? blank(v[v.length - 1]) : ''; v.push(tpl); render(); };
      fs.appendChild(add); frag.appendChild(fs);
    } else if (typeof v === 'object' && v !== null) {
      const fs = document.createElement('fieldset'); fs.innerHTML = `<legend>${humanize(k)}</legend>`;
      fs.appendChild(fields(v, p)); frag.appendChild(fs);
    } else if (typeof v === 'boolean') {
      const l = document.createElement('label'); l.innerHTML = `<input type="checkbox" ${v ? 'checked' : ''}> ${humanize(k)}`;
      l.querySelector('input').onchange = e => set(p, e.target.checked); frag.appendChild(l);
    } else {
      frag.appendChild(control(p, humanize(k), v == null ? '' : String(v)));
    }
  }
  return frag;
}
function blank(sample) { if (typeof sample === 'object' && sample !== null && !Array.isArray(sample)) { const o = {}; for (const k in sample) o[k] = typeof sample[k] === 'object' ? blank(sample[k]) : ''; return o; } return ''; }
function control(p, label, value) {
  const wrap = document.createElement('div');
  if (label) { const l = document.createElement('label'); l.textContent = label; wrap.appendChild(l); }
  const k = String(p[p.length - 1]);
  const el = document.createElement(isLong(k, value) ? 'textarea' : 'input'); if (el.tagName === 'INPUT') el.type = 'text';
  el.value = value; if (!value.trim()) el.classList.add('empty');
  el.oninput = () => { set(p, el.value); el.classList.toggle('empty', !el.value.trim()); if (el.tagName === 'TEXTAREA') { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; } };
  wrap.appendChild(el);
  if (/photo|screenshots|file/.test(k)) { const d = document.createElement('div'); d.className = 'drop'; d.innerHTML = `Upload an image: <input type="file" accept="image/*">`; d.querySelector('input').onchange = e => upload(e.target.files[0], p, el); wrap.appendChild(d); }
  requestAnimationFrame(() => { if (el.tagName === 'TEXTAREA') { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; } });
  return wrap;
}
function set(p, value) { let o = data; for (let i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = value; }
function listOp(p, i, op) { let arr = data; for (const k of p) arr = arr[k]; if (op === 'del') arr.splice(i, 1); if (op === 'up' && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; if (op === 'down' && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; render(); }

async function upload(file, p, el) {
  const buf = await file.arrayBuffer(); const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
  const r = await api('POST', '/api/media', { name: file.name, data_base64: b64 });
  el.value = r.file; el.classList.remove('empty'); set(p, r.file); msg('Uploaded ' + r.file + '. Save to apply.', 'ok');
}
async function save() {
  if (!current) return msg('Pick a page on the left first.');
  try { const r = await api('PUT', '/api/file?path=' + encodeURIComponent(current), { data }); msg('Saved. ' + r.build, 'ok'); refreshStatus(); }
  catch (e) { msg('Save failed: ' + e.message, 'err'); }
}
function preview() {
  let target = basePath + '/index.html';
  if (current && current.startsWith('pages/')) target = basePath + '/' + current.replace('pages/', '').replace('home.json', 'index.html').replace('.json', '.html');
  if (current && current.startsWith('landing/pages/')) { const f = current.replace('landing/pages/', '').replace('.json', ''); target = basePath + '/' + f.replace(/__/g, '/') + '/'; }
  window.open(target, 'preview');
}
async function publish() {
  if (current) { try { await api('PUT', '/api/file?path=' + encodeURIComponent(current), { data }); } catch (e) { return msg('Save failed: ' + e.message, 'err'); } }
  const m = prompt('Describe the change (shown in the site history):', 'Copy update');
  if (m === null) return;
  msg('Publishing…');
  try { const r = await api('POST', '/api/publish', { message: m }); msg('Published. Live in about a minute.\n' + r.log, 'ok'); refreshStatus(); }
  catch (e) { msg('Publish failed: ' + e.message, 'err'); }
}
async function refreshStatus() {
  try { const s = await api('GET', '/api/status'); document.getElementById('status').innerHTML = `<b>${s.changed}</b> unpublished change${s.changed === 1 ? '' : 's'} · last publish ${s.last_commit}`; } catch (e) {}
}
async function loadNotes() { try { const n = await api('GET', '/api/notes'); document.getElementById('notes').value = n.text; } catch (e) {} }
async function saveNotes() { await api('PUT', '/api/notes', { text: document.getElementById('notes').value }); msg('Notes saved. Claude reads them at the start of the next session.', 'ok'); }

loadTree().then(() => { const h = decodeURIComponent(location.hash.slice(1)); open(h && files.some(f => f.path === h) ? h : 'pages/home.json'); });
loadNotes();
</script>
</body>
</html>
